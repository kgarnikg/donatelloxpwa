# Локальная конфигурация Supabase для разработки DonatelleX.
# Полная документация: https://supabase.com/docs/guides/local-development/cli/config
project_id = "donatellox"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Локальный почтовый сервер для тестирования писем (подтверждение email, сброс пароля).
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[storage.buckets.videos]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["video/mp4", "video/webm", "video/quicktime"]

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.progress-photos]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5174",
  "http://127.0.0.1:5175",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_OAUTH_CLIENT_ID)"
secret = "env(APPLE_OAUTH_CLIENT_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.payment-webhook]
# JWT-проверка отключена: вебхуки платежных провайдеров не могут прислать
# наш Supabase JWT. Подлинность запроса проверяется внутри функции по
# подписи каждого провайдера (Stripe/PayPal/ЮKassa) или по данным
# транзакции в блокчейне (USDT).
verify_jwt = false

[analytics]
enabled = false
